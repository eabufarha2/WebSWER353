<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Online Shopping - Cart</title>

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/cart.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
  </head>

  <body>
    <div id="header-placeholder"></div>

    <section class="cart-1" id="cartItems" data-testid="cart-items-section">
      <div class="cart-header">
        <h2>Your Cart is empty</h2>
      </div>
    </section>

    <section class="cart-1 section-p1" id="money">
      <div class="cart-total" id="cartTotalSection">
        <table>
          <tr>
            <td>Subtotal</td>
            <td id="subtotal" data-testid="cart-subtotal">₪0.00</td>
          </tr>
          <tr>
            <td>Shipping</td>
            <td data-testid="cart-shipping">₪5.00</td>
          </tr>
          <tr>
            <td>Total</td>
            <td id="total" data-testid="cart-total">₪5.00</td>
          </tr>
        </table>
        <button class="normal" id="checkoutBtn" data-testid="checkout-btn">Pay</button>

        <!-- Dev/Test Buttons for Selenium -->
        <div style="margin-top: 20px; padding-top: 10px; border-top: 1px dashed #ccc;">
          <p style="font-size: 12px; color: #666; margin-bottom: 10px;">Dev Tools (for testing):</p>
          <button class="normal" id="resetCartBtn" data-testid="reset-cart-btn" style="background-color: #e74c3c; margin-right: 10px;">Reset Cart</button>
          <button class="normal" id="seedCartBtn" data-testid="seed-cart-btn" style="background-color: #3498db;">Seed Cart</button>
        </div>
      </div>
    </section>

    <div
      id="checkoutMessage"
      data-testid="checkout-message"
      style="
        display: none;
        text-align: center;
        padding: 20px;
        color: #088178;
        font-size: 18px;
      "
    ></div>

    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="js/global.js"></script>
    <script src="js/cart.js"></script>
  </body>
</html>
